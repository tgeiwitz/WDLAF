<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WDLAF - WooDelivery Task Assistant</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #1a1a2e;
    color: #fff;
    padding: 16px 24px;
    font-size: 18px;
    font-weight: 600;
    flex-shrink: 0;
  }

  header span { color: #7c83ff; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    max-width: 720px;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 15px;
  }

  .msg.user {
    align-self: flex-end;
    background: #1a1a2e;
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg.assistant {
    align-self: flex-start;
    background: #fff;
    color: #1a1a1a;
    border: 1px solid #e0e0e0;
    border-bottom-left-radius: 4px;
  }

  .msg.error {
    align-self: flex-start;
    background: #fff0f0;
    color: #c00;
    border: 1px solid #fcc;
    border-bottom-left-radius: 4px;
  }

  .msg.thinking {
    align-self: flex-start;
    background: #fff;
    color: #999;
    border: 1px solid #e0e0e0;
    border-bottom-left-radius: 4px;
    font-style: italic;
  }

  #input-area {
    flex-shrink: 0;
    padding: 16px 24px;
    background: #fff;
    border-top: 1px solid #e0e0e0;
    display: flex;
    gap: 12px;
  }

  #input-area input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
  }

  #input-area input:focus { border-color: #7c83ff; }

  #input-area button {
    padding: 12px 24px;
    background: #1a1a2e;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 500;
  }

  #input-area button:hover { background: #2a2a4e; }
  #input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<header><span>WDLAF</span> &mdash; WooDelivery Task Assistant</header>

<div id="chat">
  <div class="msg assistant">Hi! I can help you manage your WooDelivery tasks. Try something like:

- "Show me all unassigned tasks"
- "Create a delivery to 123 Main St for John Smith"
- "Mark task abc123 as completed"
- "Test the API connection"</div>
</div>

<div id="input-area">
  <input type="text" id="msg" placeholder="Type a message..." autocomplete="off">
  <button id="send">Send</button>
</div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("msg");
  const btn = document.getElementById("send");

  function addMsg(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;

    addMsg(text, "user");
    input.value = "";
    btn.disabled = true;
    input.disabled = true;

    const thinking = addMsg("Thinking...", "thinking");

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      thinking.remove();

      if (data.error) {
        addMsg("Error: " + data.error, "error");
      } else {
        addMsg(data.reply, "assistant");
      }
    } catch (e) {
      thinking.remove();
      addMsg("Failed to reach the server: " + e.message, "error");
    }

    btn.disabled = false;
    input.disabled = false;
    input.focus();
  }

  btn.addEventListener("click", send);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") send();
  });

  input.focus();
</script>
</body>
</html>
